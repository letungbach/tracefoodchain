name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  CF_PAGES_PROJECT: tracealot-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Write .env (bundled asset read by flutter_dotenv)
        run: |
          cat > .env <<EOT
          FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"
          GOOGLE_MAPS_API_KEY="${{ secrets.GOOGLE_MAPS_API_KEY }}"
          USER_REGISTRY_EMAIL="${{ secrets.USER_REGISTRY_EMAIL }}"
          USER_REGISTRY_PASSWORD="${{ secrets.USER_REGISTRY_PASSWORD }}"
          EOT

      - run: flutter pub get

      - name: Build Flutter web
        run: |
          flutter build web --release --no-tree-shake-icons \
            --dart-define=ENVIRONMENT=production \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID || '1:676641617260:web:11451b6ad7f20108dbb0a2' }}" \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID="${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '447745789348' }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID || 'tracealot-f6ba9' }}" \
            --dart-define=FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN || 'tracealot-f6ba9.firebaseapp.com' }}" \
            --dart-define=FIREBASE_STORAGE_BUCKET="${{ secrets.FIREBASE_STORAGE_BUCKET || 'tracealot-f6ba9.firebasestorage.app' }}"

      - name: Add Cloudflare Pages SPA redirect and headers
        run: |
          printf '/*    /index.html   200\n' > build/web/_redirects
          cat > build/web/_headers <<'EOT'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
          /index.html
            Cache-Control: no-cache, no-store, must-revalidate
          /flutter_service_worker.js
            Cache-Control: no-cache, no-store, must-revalidate
          /canvaskit/*
            Cache-Control: public, max-age=31536000, immutable
          EOT

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PAGES_PROJECT")
          if [ "$code" = "404" ]; then
            curl -sf -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -d "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"main\"}" > /dev/null
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true
